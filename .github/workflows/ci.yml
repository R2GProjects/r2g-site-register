name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build needs a session secret present, but never the real one.
      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: ci-build-placeholder-not-a-real-secret
          NOCODB_API_TOKEN: ""
