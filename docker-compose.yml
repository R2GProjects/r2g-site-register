services:
  r2g-site-register:
    build: .
    container_name: r2g-site-register
    ports:
      - "8100:3000"
    networks:
      - apps-network
      - nocodb_nocodb-net
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  apps-network:
    external: true
    name: apps-network
  nocodb_nocodb-net:
    external: true
    name: nocodb_nocodb-net